[project]
name = "medi-desk-ai"
version = "2.0.0"
description = "Medi Desk AI — WhatsApp + browser voice-call (Gemini Live) AI receptionist for clinics. Google ADK (Gemini) + FastAPI, MongoDB-backed."
readme = "PLAN.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-adk>=2.14.1",
    "google-genai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pymongo>=4.6",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
    "langfuse>=5.2.0",
    "openinference-instrumentation-google-adk>=1.1.6",
    "google-auth[requests]>=2.40",
    "litellm>=1.110.1",
]

[project.scripts]
medi-desk-ai = "clinic_agent.app:main"
clinic-agent = "clinic_agent.app:main"  # old name, kept so existing scripts keep working

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock>=4.1",
    "websockets>=15.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_agent"]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "B008"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
