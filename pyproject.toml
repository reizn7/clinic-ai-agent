[project]
name = "clinic-ai-agent"
version = "2.0.0"
description = "Text-only WhatsApp clinic AI agent — Google ADK (Gemini) + FastAPI, MongoDB-backed."
readme = "PLAN.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-adk",
    "google-genai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pymongo>=4.6",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "certifi>=2024.0",
]

[project.scripts]
clinic-agent = "clinic_agent.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_agent"]

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "v1"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["E501", "B008"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
